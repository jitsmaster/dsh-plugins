# Identity and versions of the Review Queue TWA shell. The application id is also what hub.config.json android.packageName
# and /.well-known/assetlinks.json must name (android/fingerprint.ps1 writes it there).
rq.applicationId=dev.dsh.reviewqueue
rq.versionCode=1
rq.versionName=0.1.0

org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.daemon=false
android.useAndroidX=true
android.nonTransitiveRClass=true
