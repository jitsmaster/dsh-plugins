- insert:
    - id: remote-access
      name: dsh-remote-access
      config:
        # Opt-in. Nothing listens until this is true AND a password has been set
        # (run: node setup.js [--totp]). Fails closed otherwise.
        enabled: false
        # Local HTTPS auth proxy. Loopback only: just the SSH tunnel reaches it.
        port: 8443
        listenHost: 127.0.0.1
        # The only thing ever proxied: the local DSH web server.
        targetHost: 127.0.0.1
        targetPort: 3080
        sessionHours: 12
        # Names/IPs for the generated self-signed certificate (your relay's DNS name / IP).
        # hostnames: [relay.example.com]
        # Or your own certificate instead:
        # tlsCert: C:\path\fullchain.pem
        # tlsKey: C:\path\privkey.pem
        # Outbound reverse tunnel via Windows' built-in OpenSSH (key auth only).
        # tunnel:
        #   host: relay.example.com
        #   user: dshtunnel
        #   sshPort: 22
        #   identityFile: C:\Users\you\.ssh\dsh_tunnel_ed25519
        #   remotePort: 8443
        #   bindAddress: 0.0.0.0
        # Alternative to ssh: Tailscale Funnel (needs HTTPS + Funnel enabled in the tailnet admin console).
        # tailscale:
        #   funnel: true
        #   httpsPort: 443
